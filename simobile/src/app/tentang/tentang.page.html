<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/dashboard"></ion-back-button>
    </ion-buttons>
    <ion-title>Tentang Aplikasi</ion-title>
  </ion-toolbar>
</ion-header>


<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Tentang</ion-title>
    </ion-toolbar>
  </ion-header>

  <div id="bingkai-logo">
    <ion-avatar id="logoAplikasi" class="logo-besar">
      <ion-img [src]="logo" (ionError)="logo = 'assets/no-image.svg'"></ion-img>
    </ion-avatar>
  </div>

  <ion-card class="kartu-naik">
    <ion-card-content class="tengah">
      <h1>{{ namaAplikasi }}</h1>
      <p>Aplikasi kasir mobile untuk Toko Makmur Jaya</p>
      <ion-text color="medium">Versi {{ versiAplikasi }}</ion-text>
    </ion-card-content>
  </ion-card>

<ion-card>
  <ion-card-header>
    <ion-card-subtitle>Dikembangkan oleh</ion-card-subtitle>
    <ion-card-title>Kelompok 3</ion-card-title>
  </ion-card-header>
  <ion-card-content>
    <ion-list lines="none">
      <ion-item>
        <ion-icon name="person-outline" slot="start" color="primary"></ion-icon>
        <ion-label>Oey Matthew Farrel Wiyono (160424031)</ion-label>
      </ion-item>
      <ion-item>
        <ion-icon name="person-outline" slot="start" color="primary"></ion-icon>
        <ion-label>Artchie Leonheart Constantianus (160424132)</ion-label>
      </ion-item>
      <ion-item>
        <ion-icon name="person-outline" slot="start" color="primary"></ion-icon>
        <ion-label>Aston Christianto (160424095)</ion-label>
      </ion-item>
      <ion-item>
        <ion-icon name="person-outline" slot="start" color="primary"></ion-icon>
        <ion-label>Imanuel Ferdinand Sormin (160424120)</ion-label>
      </ion-item>
    </ion-list>
  </ion-card-content>
</ion-card>

</ion-content>
