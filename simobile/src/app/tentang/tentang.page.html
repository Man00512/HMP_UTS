<ion-header [translucent]="true">
  <ion-toolbar color="primary">
    <ion-title>Tentang Aplikasi</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Tentang</ion-title>
    </ion-toolbar>
  </ion-header>

  <div id="bingkai-logo">
    <ion-avatar id="logoAplikasi" class="logo-besar">
      <ion-img src="assets/icon/favicon.png"></ion-img>
    </ion-avatar>
  </div>

  <ion-card class="kartu-naik">
    <ion-card-content class="tengah">
      <h1>{{ namaAplikasi }}</h1>
      <p>Aplikasi kasir mobile untuk Toko Makmur Jaya</p>
      <ion-text color="medium">Versi {{ versiAplikasi }}</ion-text>
    </ion-card-content>
  </ion-card>

  <ion-card>
    <ion-card-header>
      <ion-card-subtitle>Dikembangkan oleh</ion-card-subtitle>
      <ion-card-title>{{ namaKelompok }}</ion-card-title>
    </ion-card-header>
    <ion-card-content>
      <ion-list lines="none">
        <ion-item *ngFor="let anggota of anggotaKelompok">
          <ion-icon name="person-outline" slot="start" color="primary"></ion-icon>
          <ion-label>{{ anggota }}</ion-label>
        </ion-item>
      </ion-list>
      <ion-text color="medium">
        <p>Dibangun dengan Ionic Angular &mdash; Informatics Engineering, Universitas Surabaya</p>
      </ion-text>
    </ion-card-content>
  </ion-card>

</ion-content>
