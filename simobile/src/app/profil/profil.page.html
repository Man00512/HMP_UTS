<ion-header [translucent]="true">
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <ion-title>Profil</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <div class="bingkai-avatar">
    <div id="bingkaiAvatar">
      <ion-avatar id="avatarProfil" class="avatar-besar">
        <ion-img [src]="fotoProfil"></ion-img>
      </ion-avatar>
    </div>
    <h2 class="nama-pemilik">{{ namaPemilik }}</h2>
    <ion-text color="medium">Pemilik Toko</ion-text>
  </div>

  <ion-card class="kartu-info">
    <ion-list lines="full">
      <ion-item>
        <ion-icon name="storefront-outline" slot="start" color="primary"></ion-icon>
        <ion-label>
          <p>Nama Toko</p>
          <h3>{{ namaToko }}</h3>
        </ion-label>
      </ion-item>
      <ion-item>
        <ion-icon name="location-outline" slot="start" color="primary"></ion-icon>
        <ion-label>
          <p>Alamat</p>
          <h3>{{ alamat }}</h3>
        </ion-label>
      </ion-item>
      <ion-item lines="none">
        <ion-icon name="call-outline" slot="start" color="primary"></ion-icon>
        <ion-label>
          <p>Telepon</p>
          <h3>{{ telepon }}</h3>
        </ion-label>
      </ion-item>
    </ion-list>
  </ion-card>
</ion-content>
