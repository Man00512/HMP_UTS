<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <ion-title>Dashboard</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding">
  <div id="ringkasan">
    <ion-card>
      <ion-card-header>
        <ion-card-subtitle>Ringkasan Hari Ini</ion-card-subtitle>
        <ion-card-title>Toko Makmur Jaya</ion-card-title>
      </ion-card-header>
    </ion-card>

    <ion-card>
      <ion-card-content>
        <ion-item lines="none">
          <ion-icon name="cube-outline" slot="start" color="primary"></ion-icon>
          <ion-label>
            <p>Jumlah Produk</p>
            <h2>{{ jumlahProduk() }} item</h2>
          </ion-label>
        </ion-item>
      </ion-card-content>
    </ion-card>

    <ion-card>
      <ion-card-content>
        <ion-item lines="none">
          <ion-icon name="receipt-outline" slot="start" color="primary"></ion-icon>
          <ion-label>
            <p>Total Transaksi Hari Ini</p>
            <h2>{{ jumlahTransaksiHariIni() }} transaksi</h2>
          </ion-label>
        </ion-item>
      </ion-card-content>
    </ion-card>

    <ion-card>
      <ion-card-content>
        <ion-item lines="none">
          <ion-icon name="cash-outline" slot="start" color="primary"></ion-icon>
          <ion-label>
            <p>Total Penjualan Hari Ini</p>
            <h2>{{ formatRupiah(totalPenjualanHariIni()) }}</h2>
          </ion-label>
        </ion-item>
      </ion-card-content>
    </ion-card>

    <ion-card>
      <ion-card-content>
        <ion-item lines="none">
          <ion-icon name="trophy-outline" slot="start" color="secondary"></ion-icon>
          <ion-label>
            <p>Produk Terlaris</p>
            <h2>{{ produkTerlaris() }}</h2>
          </ion-label>
        </ion-item>
      </ion-card-content>
    </ion-card>
  </div>
</ion-content>
