<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/produk"></ion-back-button>
    </ion-buttons>
    <ion-title>Keranjang</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" [class.dark-theme]="theme.isDarkMode">
  <div class="kosong" *ngIf="items.length == 0">
    <ion-text color="medium">Keranjang masih kosong</ion-text>
  </div>

  <ion-list *ngIf="items.length > 0">
    <ion-item *ngFor="let item of items">
      <ion-label>
        <h3>{{ item.produk.nama }}</h3>
        <p>{{ formatRupiah(item.produk.hargaJual) }} x {{ item.qty }} = {{ formatRupiah(item.produk.hargaJual * item.qty) }}</p>
      </ion-label>
      <ion-buttons slot="end">
        <ion-button (click)="kurang(item)">
          <ion-icon name="remove-circle-outline" slot="icon-only"></ion-icon>
        </ion-button>
        <ion-button (click)="tambah(item)" [disabled]="item.qty >= item.produk.stok">
          <ion-icon name="add-circle-outline" slot="icon-only"></ion-icon>
        </ion-button>
        <ion-button color="danger" (click)="hapus(item)">
          <ion-icon name="trash-outline" slot="icon-only"></ion-icon>
        </ion-button>
      </ion-buttons>
    </ion-item>
  </ion-list>

  <ion-card *ngIf="items.length > 0">
    <ion-card-content>
      <ion-item lines="none">
        <ion-label>Total Belanja</ion-label>
        <ion-text slot="end" color="primary"><b>{{ formatRupiah(totalBelanja()) }}</b></ion-text>
      </ion-item>
      <p *ngIf="pesanError"><ion-text color="danger">{{ pesanError }}</ion-text></p>
      <ion-button expand="block" class="tombol-konfirmasi" (click)="konfirmasi()">
        Konfirmasi Transaksi
      </ion-button>
    </ion-card-content>
  </ion-card>
</ion-content>
