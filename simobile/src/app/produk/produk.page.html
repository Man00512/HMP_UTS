<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/dashboard"></ion-back-button>
    </ion-buttons>
    <ion-title>produk</ion-title>
    <ion-buttons slot="end">
      <ion-button routerLink="/keranjang">
        <ion-icon name="cart-outline" slot="icon-only"></ion-icon>
        <ion-badge *ngIf="jumlahKeranjang > 0" color="danger" class="cart-badge">
          {{ jumlahKeranjang }}
        </ion-badge>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">produk</ion-title>
    </ion-toolbar>
  </ion-header>

  <ion-grid>
    <ion-row>
      <ion-col size="12" size-md="6" *ngFor="let produk of produkTampil">
        <ion-card button="true" [routerLink]="['/produk-detail', produk.id]" class="product-card">
          <img src="{{ produk.gambar }}" alt="{{ produk.nama }}" class="product-card__image" />

          <ion-card-header>
            <ion-card-subtitle>{{ produk.kategori }}</ion-card-subtitle>
            <ion-card-title>{{ produk.nama }}</ion-card-title>
          </ion-card-header>

          <ion-card-content>
            <div class="product-card__footer">
              <span class="product-card__harga">{{ formatRupiah(produk.hargaJual) }}</span>

              <ion-badge slot="end" [color]="produk.stok === 0 ? 'danger' : 'medium'">
                {{ produk.stok === 0 ? 'Stok Habis' : 'Stok: ' + produk.stok }}
              </ion-badge>
            </div>
          </ion-card-content>
        </ion-card>
      </ion-col>
    </ion-row>
  </ion-grid>
</ion-content>
