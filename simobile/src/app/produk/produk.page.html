<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <ion-title>Produk</ion-title>
    <ion-buttons slot="end">
      <ion-button routerLink="/produk-form">
        <ion-icon name="add-outline" slot="icon-only"></ion-icon>
      </ion-button>
      <ion-button routerLink="/keranjang">
        <ion-icon name="cart-outline" slot="icon-only"></ion-icon>
        <ion-badge *ngIf="jumlahKeranjang() > 0" color="danger" class="cart-badge">
          {{ jumlahKeranjang() }}
        </ion-badge>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true"[class.dark-theme]="theme.isDarkMode">
  <div class="area-cari">
    <ion-input
      label="Cari produk"
      labelPlacement="floating"
      fill="outline"
      [clearInput]="true"
      [(ngModel)]="kataKunci">
    </ion-input>
  </div>

  <ion-segment [scrollable]="true" [(ngModel)]="kategoriDipilih">
    <ion-segment-button *ngFor="let k of kategoriList" [value]="k">
      <ion-label>{{ k }}</ion-label>
    </ion-segment-button>
  </ion-segment>

  <div class="kosong" *ngIf="produkTampil().length === 0">
    <ion-text color="medium">Produk tidak ditemukan</ion-text>
  </div>

  <ion-grid>
    <ion-row>
      <ion-col size="12" size-md="6" *ngFor="let produk of produkTampil()">
        <ion-card button="true" [routerLink]="['/produk-detail', produk.id]" class="product-card">
          <img [src]="produk.gambar || gambarDefault" [alt]="produk.nama" class="product-card__image" (error)="gambarError($event)" />
          <ion-card-header>
            <ion-card-subtitle>{{ produk.kategori }}</ion-card-subtitle>
            <ion-card-title>{{ produk.nama }}</ion-card-title>
          </ion-card-header>
          <ion-card-content>
            <div class="product-card__footer">
              <span class="product-card__harga">{{ formatRupiah(produk.hargaJual) }}</span>
              <ion-badge *ngIf="produk.stok === 0" color="danger">Stok Habis</ion-badge>
              <ion-badge *ngIf="produk.stok > 0" color="medium">Stok: {{ produk.stok }}</ion-badge>
            </div>
          </ion-card-content>
        </ion-card>
      </ion-col>
    </ion-row>
  </ion-grid>
</ion-content>

<ion-footer [class.dark-theme]="theme.isDarkMode">
  <ion-tab-bar slot="bottom">
    <ion-tab-button routerLink="/dashboard" routerLinkActive="tab-selected">
      <ion-icon name="home"></ion-icon>
      <ion-label>Dashboard</ion-label>
    </ion-tab-button>
    <ion-tab-button routerLink="/produk" routerLinkActive="tab-selected">
      <ion-icon name="cube"></ion-icon>
      <ion-label>Produk</ion-label>
    </ion-tab-button>
    <ion-tab-button routerLink="/transaksi" routerLinkActive="tab-selected">
      <ion-icon name="receipt"></ion-icon>
      <ion-label>Transaksi</ion-label>
    </ion-tab-button>
    <ion-tab-button routerLink="/profil" routerLinkActive="tab-selected">
      <ion-icon name="person"></ion-icon>
      <ion-label>Profil</ion-label>
    </ion-tab-button>
  </ion-tab-bar>
</ion-footer>
